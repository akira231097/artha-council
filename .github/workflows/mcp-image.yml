name: Artha MCP Image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: artha-mcp-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Verify the MCP package before publishing
        env:
          ARTHA_MCP_ACCESS_MODE: read_only
          ARTHA_MCP_OPERATIONS_ENABLED: "false"
          ARTHA_MCP_TRADING_ENABLED: "false"
          ARTHA_MCP_KILL_SWITCH: "true"
        run: |
          python -m pip install --upgrade pip
          python -m pip install .
          python -m compileall -q artha artha_mcp run.py
          python scripts/check_release_integrity.py
          artha-mcp --check
          python -m unittest discover -s tests -t . -v

      - name: Log in to GHCR
        if: github.event_name == 'push'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin

      - name: Build MCP image
        if: github.ref_type != 'tag'
        run: |
          version="$(python -c 'from artha import __version__; print(__version__)')"
          docker build \
            --file Dockerfile.mcp \
            --build-arg "ARTHA_BUILD_COMMIT=${GITHUB_SHA}" \
            --build-arg "ARTHA_BUILD_REF=${GITHUB_REF}" \
            --build-arg "ARTHA_BUILD_VERSION=${version}" \
            --tag "ghcr.io/akira231097/artha-council-mcp:${GITHUB_SHA}" \
            .

      - name: Load the tested commit image for release
        if: github.event_name == 'push' && github.ref_type == 'tag'
        run: docker pull "ghcr.io/akira231097/artha-council-mcp:${GITHUB_SHA}"

      - name: Verify image provenance and startup
        run: |
          image="ghcr.io/akira231097/artha-council-mcp:${GITHUB_SHA}"
          version="$(python -c 'from artha import __version__; print(__version__)')"
          test "$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "${image}")" = "${GITHUB_SHA}"
          test "$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.version" }}' "${image}")" = "${version}"
          docker run --rm \
            --env ARTHA_MCP_ACCESS_MODE=read_only \
            --env ARTHA_MCP_OPERATIONS_ENABLED=false \
            --env ARTHA_MCP_TRADING_ENABLED=false \
            --env ARTHA_MCP_KILL_SWITCH=true \
            "${image}" --check

      - name: Verify release metadata matches the tag
        if: github.event_name == 'push' && github.ref_type == 'tag'
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import json
          import os
          import tomllib
          from pathlib import Path

          tag = os.environ["RELEASE_VERSION"].removeprefix("v")
          project = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          server = json.loads(Path("server.json").read_text())
          image = server["packages"][0]["identifier"]
          assert project == tag, (project, tag)
          assert server["version"] == tag, (server["version"], tag)
          assert image.endswith(f":{tag}"), (image, tag)
          PY

      - name: Publish release and rolling tags
        if: github.event_name == 'push'
        run: |
          image="ghcr.io/akira231097/artha-council-mcp"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
            docker tag "${image}:${GITHUB_SHA}" "${image}:${version}"
            docker tag "${image}:${GITHUB_SHA}" "${image}:latest"
            docker push "${image}:${version}"
            docker push "${image}:latest"
          else
            docker push "${image}:${GITHUB_SHA}"
            docker tag "${image}:${GITHUB_SHA}" "${image}:main"
            docker push "${image}:main"
          fi

      - name: Install pinned MCP Registry publisher
        if: github.event_name == 'push' && github.ref_type == 'tag'
        run: |
          version="1.8.1"
          archive="mcp-publisher_linux_amd64.tar.gz"
          curl --fail --location --silent --show-error \
            "https://github.com/modelcontextprotocol/registry/releases/download/v${version}/${archive}" \
            --output "${archive}"
          echo "a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc  ${archive}" | sha256sum --check
          tar --extract --gzip --file "${archive}" mcp-publisher
          chmod +x mcp-publisher

      - name: Publish release metadata to the MCP Registry
        if: github.event_name == 'push' && github.ref_type == 'tag'
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
