name: Artha CI

on:
  push:
    branches: [main, "agent/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: artha-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ARTHA_ROBINHOOD_REVIEW_ONLY: "true"
      ARTHA_ROBINHOOD_DRY_RUN_ONLY: "true"
      ARTHA_ROBINHOOD_AGENTIC_ENABLED: "false"
      ARTHA_ROBINHOOD_AUTO_BUY_ENABLED: "false"
      ARTHA_ROBINHOOD_AUTO_SELL_ENABLED: "false"
      ARTHA_ROBINHOOD_KILL_SWITCH: "true"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --editable .
          npm ci

      - name: Compile source
        run: python -m compileall -q artha artha_mcp dashboard run.py

      - name: Verify release and MCP source alignment
        run: python scripts/check_release_integrity.py

      - name: Validate MCP configuration and protocol tests
        run: |
          python -m artha_mcp --check
          python -m unittest discover -s tests -t . -v

      - name: Run enhancement tests
        run: python -m artha.test_enhancements

      - name: Run production-hardening tests
        run: python -m artha.test_production_hardening

      - name: Run alpha-pipeline hardening tests
        run: python -m artha.test_alpha_pipeline_hardening

      - name: Run feedback-loop hardening tests
        run: python -m artha.test_feedback_loop_hardening

      - name: Run dashboard contract tests
        run: python -m unittest dashboard.test_dashboard -v

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
