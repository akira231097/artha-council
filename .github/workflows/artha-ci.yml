name: Artha CI

on:
  push:
    branches: [main, "agent/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: artha-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ARTHA_ROBINHOOD_REVIEW_ONLY: "true"
      ARTHA_ROBINHOOD_DRY_RUN_ONLY: "true"
      ARTHA_ROBINHOOD_AGENTIC_ENABLED: "false"
      ARTHA_ROBINHOOD_AUTO_BUY_ENABLED: "false"
      ARTHA_ROBINHOOD_AUTO_SELL_ENABLED: "false"
      ARTHA_ROBINHOOD_KILL_SWITCH: "true"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          npm ci

      - name: Compile source
        run: python -m compileall -q artha dashboard run.py

      - name: Run enhancement tests
        run: python -m artha.test_enhancements

      - name: Run production-hardening tests
        run: python -m artha.test_production_hardening

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
